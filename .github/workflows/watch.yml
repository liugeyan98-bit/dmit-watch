name: DMIT Restock Watch

on:
  schedule:
    # 每 10 分钟一次（GitHub 免费额度；高峰可能延迟几分钟）
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "只发一封测试邮件（验证 tongzhi 配置）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dmit-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: dmit-watch-state-${{ github.run_id }}
          restore-keys: |
            dmit-watch-state-

      - name: Watch
        env:
          TONGZHI: ${{ secrets.tongzhi }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.test }}
        run: python watch.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: dmit-watch-state-${{ github.run_id }}
